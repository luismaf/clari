[package]
name = "clari"
version = "0.6.6"
edition = "2021"
description = "clari — CLAude Run Initiator. Keeps Claude Code running: quota watch + auto-resume."
license = "MIT"
repository = "https://github.com/luismaf/clari"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true